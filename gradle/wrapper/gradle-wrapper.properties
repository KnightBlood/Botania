distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# NB: GitHub-hosted runners were refusing connections to services.gradle.org during
# the 26.1 port; Gradle publishes the same zips on its official GitHub mirror, which
# runners can always reach. Same artifact, same checksums.
distributionUrl=https\://github.com/gradle/gradle-distributions/releases/download/v9.8.1/gradle-9.8.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
