plugins {
    id 'java'
    id 'java-library'
    id 'net.neoforged.moddev' version "${neo_moddev_version}"
}

version = "${minecraft_version}-${build_number}-NEOFORGE"
if (System.getenv().RELEASE_MODE != "1") {
    version += '-SNAPSHOT'
}

// Mixin configs are registered via neoforge.mods.toml [[mixins]] section

// Resolve outside the neoForge DSL: `project(...)` is intercepted inside it.
def xplatGeneratedDir = project(':Xplat').file('src/generated/resources')
def xplatMainDir = project(':Xplat').file('src/main/resources')

repositories {
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "C4"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Shedaniel" // Cloth Config and REI
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
            includeGroup("me.shedaniel")
        }
    }
    maven {
        name = "Architectury" // REI's fluid API types at compile time
        url = "https://maven.architectury.dev/"
        content {
            includeGroup("dev.architectury")
        }
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/" // for emi and ears
        content {
            includeGroup("com.unascribed")
            includeGroup("dev.emi")
        }
    }
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/releases/" // for trinkets 4.x / yumi commons
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven" // for Sodium
        content {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = neo_version
    accessTransformers = [project(":Xplat").file('src/main/resources/META-INF/accesstransformer.cfg')]

    if (parchment_version != 'none') {
        parchment {
            minecraftVersion = parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }

    runs {
        client {
            client()
            systemProperty('forge.logging.console.level', 'debug')
        }

        server {
            server()
            systemProperty('forge.logging.console.level', 'debug')
        }

        // MDG 26.1: the old `data()` run type is gone; server-side datagen is now serverData()
        serverData {
            serverData()
            programArguments.addAll "-mixin.config=botania_xplat.mixins.json", "-mixin.config=botania_neoforge.mixins.json"
            programArguments.addAll '--mod', 'botania', '--all'
            programArguments.addAll '--flat'
            programArguments.addAll '--output', file('src/generated/resources/').getAbsolutePath()
            programArguments.addAll '--existing', file('src/main/resources/').getAbsolutePath()
            programArguments.addAll '--existing', xplatGeneratedDir.getAbsolutePath()
            programArguments.addAll '--existing', xplatMainDir.getAbsolutePath()
        }

        configureEach {
            gameDirectory = file('../run/')
            systemProperty('fml.earlyprogresswindow', 'false')
            // REI 26.1.819 (NeoForge jar) still ships @OnlyIn annotations, even though
            // MC 26.1 removed their runtime member-stripping behaviour. In dev launches
            // NeoForge's OnlyInWarningsHandler turns every such mod file into a
            // ModLoadingIssue.warning screen that blocks runClient before the title screen.
            // Both 26.1.818 and 26.1.819 contain 133 annotated classes, and the 26.2/26.3
            // builds target a different Minecraft line, so there is no clean 26.1 artifact.
            // Production (non-dev) launches never run this handler at all; suppressing the
            // dev-only warning therefore matches shipping behaviour. This does NOT remove the
            // annotations or hide the underlying log entries - they are still logged as ERROR.
            systemProperty('neoforge.warnings.onlyin.hide', 'true')
        }
    }

    mods {
        botania {
            sourceSet sourceSets.main
            sourceSet project(":Xplat").sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":Xplat")
    // NeoForge 26.1 is unobfuscated - no mixin refmap / annotation processor needed

    implementation("vazkii.patchouli:patchouli-neoforge:${patchouli_version}")
    // JEI publishes its API artifact on the 26.1 line; pin it explicitly so that
    // minecraft_version (now 26.1.2) does not silently resolve a different artifact.
    compileOnly("mezz.jei:jei-26.1-common-api:${jei_version}")
    // Still compileOnly: the 26.1-line JEI runtime build originally required a newer NeoForge
    // than the old pin. NeoForge is now 26.1.2.126, so that condition is met, but restoring the
    // runtime dependency needs a matching 26.1.2 JEI artifact and a fresh compatibility check.
    // runtimeOnly("mezz.jei:jei-26.1-neoforge:${jei_version}")

    // EMI unofficial port (curseforge 1544558, no maven) - local jar, mojmap neoforge build
    compileOnlyApi(rootProject.files("libs/emi-1.1.24+26.1.2+neoforge.jar"))
    //runtimeOnly("dev.emi:emi-neoforge:${emi_version}")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}")

    // Trinkets Updated 4.x is a single jar for both loaders (fabric.mod.json +
    // META-INF/neoforge.mods.toml) and is an OPTIONAL secondary accessory backend.
    // 4.0.x+26.1 needs NeoForge classes from the 26.1.2.x line
    // (TagsUpdatedEvent$ClientPacketReceived / common.tooltip.ItemTooltipHandler), hence the
    // NeoForge upgrade in gradle.properties. runtimeOnly puts it on the dev run's mod
    // classpath so the integration is actually exercised; it is NOT bundled in the release jar.
    compileOnly("eu.pb4:trinkets:${trinkets_version}")
    runtimeOnly("eu.pb4:trinkets:${trinkets_version}")
    // Trinkets' client API classes carry Fabric's @Environment(EnvType.CLIENT) annotation.
    // Without the annotation class javac emits a non-suppressible "unknown enum constant"
    // warning, which -Werror turns into an error. Compile-time only; NeoForge never loads
    // Fabric Loader at runtime (the annotation is CLASS-retention and stays unresolved).
    compileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    // Cloth Config + jankson: shared ClothBotaniaConfig (JSON5 config + screen) needs
    // both at compile time (Xplat sources are compiled into this module) and runtime.
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    compileOnly("blue.endless:jankson:1.2.0")
    runtimeOnly("blue.endless:jankson:1.2.0")

    // Official REI 26.1 NeoForge build: supplies the same API as the Fabric build plus
    // @REIPluginClient, which is how NeoForge discovers the shared Xplat plugin.
    // Compile-only - REI stays an optional mod; see neoforge.mods.toml.
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}")

    // compileOnly('com.blamejared.crafttweaker:CraftTweaker-forge-1.18.2:9.1.123')

    compileOnly('com.unascribed:ears-api:1.4.5')

    // Official Sodium 0.9.2 for MC 26.1.2 ships for both loaders with the SAME
    // net.caffeinemc.mods.sodium API (SpriteUtil.INSTANCE). The NeoForge release (zg4YQ9EL) is
    // a jarjar launcher: its classes live in META-INF/jarjar/*-mod.jar, so it cannot serve as a
    // compileOnly dependency. The Fabric release (tZQ3jqnf) is a plain mod jar with identical
    // API classes, so both modules compile against that one coordinate. At runtime the player
    // installs the build for their loader; SodiumPresence gates every call.
    // 0.8.9+mc26.1.1 is NOT usable on NeoForge 26.1.2.126 (calls a removed 4-arg
    // SectionRenderingContext constructor). Rubidium/Embeddium have no 26.1 release,
    // so the old me.jellysquid.mods.sodium bridge is gone.
    compileOnly('maven.modrinth:sodium:tZQ3jqnf') { transitive = false } // 0.9.2+mc26.1.2-fabric, API shared with NeoForge

    compileOnly "org.jetbrains:annotations:24.0.1"
}

compileJava {
    source(project(":Xplat").sourceSets.main.allSource)
    // -this-escape: standard modding pattern (registering callbacks / default states
    // from constructors) triggers this lint everywhere; suppressed project-wide.
    options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-serial,-this-escape" << "-Werror"
}

sourcesJar {
    from project(":Xplat").sourceSets.main.allJava
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'assets/botania/patchouli_books/lexicon/en_us/README'
}

processResources {
    // The Forge-specific datagen outputs include the botania:* tags (inherited Xplat providers
    // share one builders map), which Xplat's own generated resources also contain with the same
    // content; take either copy instead of failing the build.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from project(":Xplat").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("neoforge.mods.toml") {
        expand "version": project.version
    }

    from '../contributors.properties'
    // Exclude datagenerator .cache directory
    exclude '.cache'
}
jar {
    manifest {
        attributes([
                "Specification-Title": "${mod_name}",
                "Specification-Vendor": "vazkii",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": "${mod_name}",
                "Implementation-Version": "${archiveVersion.get()}",
                "Implementation-Vendor" :"vazkii",
                "MixinConfigs": "botania_xplat.mixins.json,botania_neoforge.mixins.json"
        ])
    }
}

task apiJar(type: Jar, dependsOn: classes) {
    // Sources included because of ForgeGradle#369
    from project(":Xplat").sourceSets.main.allJava
    from(sourceSets.main.allJava)
    from(sourceSets.main.output)

    include 'vazkii/botania/api/**'

    archiveClassifier = 'api'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            artifact jar
            artifact sourcesJar
            artifact apiJar
            pom.withXml {
                def node = asNode()
                if(node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove deps, as they are all mappings-dependent and/or forge
            }
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
