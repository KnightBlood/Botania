modLoader="javafml"
loaderVersion="[1,)"
license="Botania License"
issueTrackerURL="https://github.com/Vazkii/Botania/issues"
logoFile="logo.png"

[[mods]]
modId="botania"
version="${file.jarVersion}"
displayName="Botania"
displayURL="https://botaniamod.net"
description="Botania is a mod that adds nature magic to Minecraft."
authors="Vazkii, wiiv, williewillus, dylan4ever, Hubry, Alwinfy, artemisSystem, Falkory220, Wormbo"
credits="Azanor, Flaxbeard, Futureazoo, Rorax, Lorc, Adubbz, WTFG33ks, Auric245524, MegaManki, Kain Vinosec, Kihira, dylan4ever, mDiYo, Mikeemoo, ChickenBones, PowerCrystals, cpw, quat1024, ToMe25, Eutro and others"

itemIcon="botania:cosmetic_botanist_emblem" # custom icon for Catalogue's mod list
configBackground="botania:textures/block/livingrock_bricks.png" # background for Configured's generated config screen

[[dependencies.botania]]
    modId="neoforge"
    type="required"
    versionRange="[26.1,)"

[[dependencies.botania]]
    modId="patchouli"
    type="required"
    versionRange="[26.1-85,)"

[[dependencies.botania]]
    modId="curios"
    type="required"
    versionRange="[10.0.0+26.1,)"

# Trinkets Updated 4.x: optional secondary accessory backend alongside Curios.
# The universal 4.x mod id is "trinkets_updated" (the "trinkets" alias only
# exists on Fabric through fabric.mod.json 'provides').
# NOTE: 4.0.x+26.1 needs NeoForge classes from the 26.1.2.x line
# (TagsUpdatedEvent$ClientPacketReceived / common.tooltip.ItemTooltipHandler);
# gradle.properties was upgraded accordingly. On installs with an older NeoForge
# the mod should not be installed, since the optional version range cannot
# express a NeoForge requirement.
[[dependencies.botania]]
    modId="trinkets_updated"
    type="optional"
    versionRange="[4.0.1+26.1,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.botania]]
    modId="cloth-config"
    type="optional"
    versionRange="[26.1,)"

# REI 26.1.819 (NeoForge) - plugin discovered via @REIPluginClient.
[[dependencies.botania]]
    modId="roughlyenoughitems"
    type="optional"
    versionRange="[26.1.819,)"
    ordering="BEFORE"
    side="BOTH"

# Inventory Sorting. Two unrelated upstream builds share this mod id: Meza 3.x (Fabric +
# NeoForge) receives a do-not-sort CompatibilityLoader from Xplat, while the cpw build keeps
# the legacy containerblacklist IMC bridge. No versionRange: the two builds number themselves
# differently, and both are supported. AFTER lets the upstream static initializer (which reads
# and writes its config) run before Botania touches its compatibility object.
[[dependencies.botania]]
    modId="inventorysorter"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.botania]]
    modId="gardenofglass"
    type="optional"
    versionRange="[1.12,)"

[[dependencies.botania]]
    modId="crafttweaker"
    type="optional"
    versionRange="[9.1.116,)"

[[dependencies.botania]]
    modId="ears"
    type="optional"
    versionRange="[1.4.5,)"

# The Naughty List:
# VMinus notoriously breaks custom recipe handling in many mods, including Botania.
[[dependencies.botania]]
    modId="vminus"
    type="incompatible"
    versionRange="(,3.2.0)"

[[mixins]]
    config="botania_xplat.mixins.json"
[[mixins]]
    config="botania_neoforge.mixins.json"
