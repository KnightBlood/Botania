modLoader="javafml"
loaderVersion="[1,)"
license="Botania License"
issueTrackerURL="https://github.com/Vazkii/Botania/issues"
logoFile="logo.png"

[[mods]]
modId="botania"
version="${file.jarVersion}"
displayName="Botania"
displayURL="https://botaniamod.net"
description="Botania is a mod that adds nature magic to Minecraft."
authors="Vazkii, wiiv, williewillus, dylan4ever, Hubry, Alwinfy, artemisSystem, Falkory220, Wormbo"
credits="Azanor, Flaxbeard, Futureazoo, Rorax, Lorc, Adubbz, WTFG33ks, Auric245524, MegaManki, Kain Vinosec, Kihira, dylan4ever, mDiYo, Mikeemoo, ChickenBones, PowerCrystals, cpw, quat1024, ToMe25, Eutro and others"

itemIcon="botania:cosmetic_botanist_emblem" # custom icon for Catalogue's mod list
configBackground="botania:textures/block/livingrock_bricks.png" # background for Configured's generated config screen

[[dependencies.botania]]
    modId="neoforge"
    type="required"
    versionRange="[26.1,)"

[[dependencies.botania]]
    modId="patchouli"
    type="required"
    versionRange="[26.1-85,)"

[[dependencies.botania]]
    modId="curios"
    type="required"
    versionRange="[10.0.0+26.1,)"

[[dependencies.botania]]
    modId="gardenofglass"
    type="optional"
    versionRange="[1.12,)"

[[dependencies.botania]]
    modId="crafttweaker"
    type="optional"
    versionRange="[9.1.116,)"

[[dependencies.botania]]
    modId="ears"
    type="optional"
    versionRange="[1.4.5,)"

# The Naughty List:
# VMinus notoriously breaks custom recipe handling in many mods, including Botania.
[[dependencies.botania]]
    modId="vminus"
    type="incompatible"
    versionRange="(,3.2.0)"

[[mixins]]
    config="botania_xplat.mixins.json"
[[mixins]]
    config="botania_neoforge.mixins.json"
