plugins {
    id('java')
    id 'net.neoforged.moddev' version "${neo_moddev_version}"
}

base {
    archivesName = "${mod_name}-xplat"
}
version = "${minecraft_version}-${build_number}"
if (System.getenv().RELEASE_MODE == null) {
    version += '-SNAPSHOT'
}

neoForge {
    version = neo_version
    accessTransformers = [file('src/main/resources/META-INF/accesstransformer.cfg')]

    if (parchment_version != 'none') {
        parchment {
            minecraftVersion = parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }
}

repositories {
    maven {
        name = "Jared" // Patchouli and JEI
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/" // for emi and ears
        content {
            includeGroup("com.unascribed")
            includeGroup("dev.emi")
        }
    }
    maven {
        name = "Shedaniel" // Cloth Config, basic-math and REI
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
            includeGroup("me.shedaniel")
        }
    }
    maven {
        name = "Architectury" // REI's fluid API types
        url = "https://maven.architectury.dev/"
        content {
            includeGroup("dev.architectury")
        }
    }
    maven {
        name = "Modrinth" // Inventory Sorting compile-only API
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "vazkii.patchouli:patchouli-xplat:${patchouli_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.6.1'

    // compileOnly 'com.blamejared.crafttweaker:CraftTweaker-common-1.18.2:9.1.123'

    compileOnly "com.unascribed:ears-api:1.4.5"

    // Cloth Config + jankson: ClothBotaniaConfig (shared JSON5 config + screen) is
    // compiled here and in both loader modules; each loader supplies the runtime dep.
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    compileOnly "blue.endless:jankson:1.2.0"

    // REI: the shared integration under client/integration/rei is compiled into both loaders.
    // The official platform jars contain the entire API (plus the default plugin displays), so
    // the plain Fabric build serves as the compile-only API source here; each loader module also
    // puts its own platform jar on the compile classpath. all of REI's POM dependencies are
    // runtime-scoped, so no Architectury mod is pulled into the compile classpath by accident.
    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    // REI API classes carry Fabric's @Environment(EnvType.CLIENT) annotation.
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Meza Inventory Sorting 3.x publishes the SAME compatibility API on Fabric and NeoForge.
    // The shared InventorySorterCompat is compiled into both loaders, so this compile-only jar
    // supplies its types here too. It stays strictly optional at runtime: InventorySorterPresence
    // probes the upstream classes before InventorySorterCompat is ever loaded.
    compileOnly("maven.modrinth:inventory-sorting:${inventory_sorting_version}") { transitive = false }

    compileOnly "mezz.jei:jei-26.1-common-api:${jei_version}"
// EMI unofficial port (curseforge 1544558, no maven) - local jar, mojmap neoforge build
compileOnly(rootProject.files("libs/emi-1.1.24+26.1.2+neoforge.jar"))

    compileOnly "org.jetbrains:annotations:24.0.1"

    // annotationProcessor 'com.blamejared.crafttweaker:Crafttweaker_Annotation_Processors-1.18.2:2.0.0.123'
    // annotationProcessor 'com.blamejared.crafttweaker:CraftTweaker-common-1.18.2:9.1.123'
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'assets/botania/patchouli_books/lexicon/en_us/README'
}

// 26.1: the GameTest suite has been ported and moved out of Xplat. See CONTRIBUTING.md for the
// current pass/fail status; do not assume all 93 cases pass. All 23 test classes
// (93 @GameTest cases), TestingUtil and DelegatingConfigAccess now live in
// Fabric/src/gametest/java/vazkii/botania/test/ and use Fabric API's
// net.fabricmc.fabric.api.gametest.v1.GameTest plus the "fabric-gametest" entrypoints
// in Fabric/src/main/resources/fabric.mod.json. The .snbt structures were renamed to
// the 26.1 layout data/botania/gametest/structure/ (singular). The exclude below is
// kept as a guard: Xplat main no longer contains any test sources, and keeping it
// prevents an accidental reintroduction from being compiled into the NeoForge side
// (which has no Fabric gametest annotation on its compile classpath).
sourceSets.main.java.exclude('vazkii/botania/test/**')
// TODO: JEI/EMI/Patchouli versions for 26.1 not yet available
sourceSets.main.java.exclude('vazkii/botania/client/integration/jei/**')

tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs.add("-Acrafttweaker.processor.document.output_directory=${new File(rootProject.buildDir, "docsOut")}")
    it.options.compilerArgs.add("-Acrafttweaker.processor.document.multi_source=true")

    it.options.compilerArgs << "-Xmaxerrs" << "20000"

}

processResources {
    // Exclude datagenerator .cache directory
    exclude '.cache'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
