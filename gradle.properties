# Done to increase the memory available to gradle.
# add-exports are needed for spotless to work on new Javas
org.gradle.jvmargs=-Xmx3G \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Use local JDK 25
org.gradle.java.home=D:\\WORKspace\\jdk25\\jdk-25.0.4.1

# Both loaders target MC 26.1.2: Fabric/Loom uses this value directly and
# NeoForge/MDG derives it from neo_version (26.1.2.126 -> MC 26.1.2).
# Optional integrations (JEI / REI / Patchouli / EMI) still publish on the
# 26.1 line, so their coordinates are pinned explicitly in each module.
minecraft_version=26.1.2
build_number=457
group=vazkii.botania
mod_name=Botania

# NeoForge
neo_version=26.1.2.126
neo_moddev_version=2.0.142

# Fabric
fabric_loader_version=0.19.2
fabric_api_version=0.149.1+26.1.2
fabric_loom_version=1.18.4

# Java
java_version=25

# Parchment mappings (disabled; for 26.1.2)
parchment_version=none
parchment_minecraft_version=26.1.2

# Dependency versions
patchouli_version=26.1-94
jei_version=29.2.0.21
emi_version=1.1.24+1.21.1
curios_version=15.0.0+26.1.2
trinkets_version=4.0.1+26.1
cardinal_components_version=8.0.0-alpha.5+26.1
teamreborn_energy_version=5.0.0
cloth_config_version=26.1.154
# REI 26.1.819 ships official Fabric and NeoForge builds with the same API.
# Architectury is REI's runtime dependency; its platform jars are compile-only here.
rei_version=26.1.819
architectury_version=20.0.6

# Local proxy (v2rayN SOCKS) for maven.neoforged.net etc.
systemProp.socksProxyHost=127.0.0.1
systemProp.socksProxyPort=10808
