plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'io.github.juuxel.loom-quiltflower' version '1.7.1'
}

version = "${minecraft_version}-${build_number}-FABRIC"
if (System.getenv().RELEASE_MODE != "1") {
    version += '-SNAPSHOT'
}

// 26.1: the 93 ported GameTest cases live in their own sourceSet. Keeping them out of
// Xplat/main avoids leaking Fabric's @GameTest annotation into the NeoForge compile
// (NeoForge/build.gradle also pulls Xplat main sources into its compileJava). The
// .snbt structures stay in Xplat main resources at data/botania/gametest/structure/
// and are copied into the dev runtime by processResources below, so the gametest
// resources dir is intentionally empty.
sourceSets {
    gametest {
        java {
            srcDir 'src/gametest/java'
        }
        resources {
            srcDir 'src/gametest/resources'
        }
        // See Botania's main output (which also contains the Xplat classes pulled in
        // by compileJava) and inherit the full Fabric compile/runtime dependency set.
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    accessWidenerPath = file("src/main/resources/botania.accesswidener")
    // 26.1: MC is unobfuscated, mixins need no refmap and the mixin AP is off by default.

    runs {
        // 26.1: this run is now wired up. The 93 cases in Fabric/src/gametest/java are
        // discovered through the "fabric-gametest" entrypoints in fabric.mod.json and
        // executed by fabric-gametest-api-v1 (already pulled in by the fabric-api dep).
        gameTest {
            server()
            // Loom 1.18.4 RunConfigSettings#source(SourceSet) puts the gametest
            // classes+resources on this run's dev classpath and makes gametest the
            // run's source set. gametest.runtimeClasspath above explicitly includes
            // main.output and main.runtimeClasspath so the mod itself stays loadable.
            // (Fallback if that Loom API is unavailable: add sourceSets.gametest.output
            // to this run config's classpath explicitly.)
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest=1"
        }

        xplatDatagen {
            client()
            // The fabric-gametest entrypoint classes must be on the classpath even here:
            // fabric-gametest-api-v1 resolves all declared entrypoints during the main
            // stage and crashes with ClassNotFoundException otherwise.
            source sourceSets.gametest
            vmArg "-Dbotania.xplat_datagen=1"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=botania"
            vmArg "-Dfabric-api.datagen.output-dir=${file("../Xplat/src/generated/resources")}"
        }

        fabricDatagen {
            client()
            // See xplatDatagen above.
            source sourceSets.gametest
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=botania"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
        }

        configureEach {
            runDir "../run"
            ideConfigGenerated(true)
        }
    }

}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = "Modmuss"
        url = "https://maven.modmuss50.me/"
    }
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com/" // for JEI and Patchouli
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/" // for emi, trinkets, and ears
        content {
            includeGroup("com.unascribed")
            includeGroup("dev.emi")
            includeGroup("eu.pb4")
        }
    }
    maven {
          name = "Ladysnake Libs"
          url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "BuildCraft" // for LBA
        url = "https://mod-buildcraft.com/maven"
    }
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/releases/" // for trinkets
    }
    maven {
        url "https://maven.shedaniel.me/" // for rei
    }
    maven {
        name = "Architectury" // REI's fluid API types at compile time
        url = "https://maven.architectury.dev/"
        content {
            includeGroup("dev.architectury")
        }
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.net/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven" // for "here be no dragons"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // MC 26.1 is unobfuscated: the new net.fabricmc.fabric-loom plugin does not remap,
    // so plain implementation/compileOnly is correct (modImplementation is gone).
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly project(":Xplat")

    implementation "vazkii.patchouli:patchouli-fabric:${patchouli_version}"
    
    // Official REI 26.1 build. The shared plugin lives in Xplat; this jar supplies the
    // full API (and the default-plugin displays) on the Fabric compile classpath.
    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    compileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    
    // EMI unofficial port (curseforge 1544558, no maven) - local jar, mojmap neoforge build for compileOnly
    compileOnly(rootProject.files("libs/emi-1.1.24+26.1.2+neoforge.jar"))
    
    // Cloth Config (replaces Fiber)
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    // 26.1: cloth-config no longer pulls jankson transitively, but our config code uses it directly
    implementation "blue.endless:jankson:1.2.0"

    // Mod Menu: exposes the shared Cloth config screen via the modmenu entrypoint
    compileOnly "maven.modrinth:modmenu:18.0.1"
    runtimeOnly "maven.modrinth:modmenu:18.0.1"
    
    // Don't include base and entity as Trinkets includes it already
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    
    compileOnly "com.demonwav.mcdev:annotations:1.0" // only to shut up compile warnings from CCA's usage of CheckEnv and Env
    
    // 26.1 trinkets 4.x pulls in dev.yumi.commons (TriState/Event) which our integration needs at compile time
    implementation "eu.pb4:trinkets:${trinkets_version}"
    
    // Reach & Step Height are now vanilla Attributes in MC 26.1
    // Attributes.BLOCK_INTERACTION_RANGE, Attributes.ENTITY_INTERACTION_RANGE, Attributes.STEP_HEIGHT
    
    compileOnly "teamreborn:energy:${teamreborn_energy_version}"
    
    compileOnly('maven.modrinth:sodium:tZQ3jqnf') { transitive = false } // 0.9.2+mc26.1.2-fabric (NeoForge uses zg4YQ9EL)

    // Meza Inventory Sorting 3.x: the shared do-not-sort loader lives in Xplat. Compile-only,
    // the mod stays optional; the player (or a dev run's mods folder) supplies the runtime jar.
    compileOnly("maven.modrinth:inventory-sorting:${inventory_sorting_version}") { transitive = false }
    
    // modCompileOnly 'com.blamejared.crafttweaker:CraftTweaker-fabric-1.18.2:9.1.123'
    
    compileOnly "com.unascribed:ears-api:1.4.5"
    
    compileOnly "mezz.jei:jei-26.1-common-api:${jei_version}"
    
    runtimeOnly "maven.modrinth:here-be-no-dragons:1.0.0"
    
    // 26.1: upstream only publishes 14.2+26.1.1-alpha.26.14.a for this MC line
    compileOnly "maven.modrinth:speedrunigt:14.2+26.1.1-alpha.26.14.a"
    // modRuntimeOnly "maven.modrinth:speedrunigt:14.2+${minecraft_version}"
}

compileJava {
	source(project(":Xplat").sourceSets.main.allSource)
	options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-serial" << "-Werror"

}

sourcesJar {
    from project(":Xplat").sourceSets.main.allJava
}

processResources {
    from project(":Xplat").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from '../contributors.properties'
    // Exclude datagenerator .cache directory
    exclude '.cache'

    filesMatching('data/botania/patchouli_books/lexicon/book.json') {
        filter {
            it.replaceAll("buildNumber", build_number)
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.base.archivesName.get()
            version project.version
            from components.java
        }
    }

    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
